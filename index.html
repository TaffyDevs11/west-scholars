<!--
    Only the demo controller is loaded here.

    The real validator and upload widget (assets/js/*.js) are each an
    IIFE that looks for [data-profile-form] the moment it runs and returns
    immediately if it is absent. This demo renders its views into the page
    after load, so at this point that form does not exist yet and both would
    simply do nothing.

    demo.js therefore injects them as fresh <script> elements each time it
    renders the profile form — appending a script element always executes
    it, even when the file is already cached — so the form is driven by the
    application's genuine, unmodified client-side code rather than by a
    reimplementation that could drift away from it.
-->
<script src="assets/js/demo.js" defer></script>
